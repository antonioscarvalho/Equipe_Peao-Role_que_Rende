<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FCFC30" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13133A" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icones/broto.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <!-- iPhone: abre em tela cheia quando adicionado à Tela de Início, com o nome curto embaixo do ícone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Broto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Aplica o tema antes do React (mesma regra de src/tema.ts), para a tela não piscar.
      (function () {
        var p = "auto";
        try { p = localStorage.getItem("rqr-tema") || "auto"; } catch (e) {}
        var escuro = p === "escuro" || (p !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
      })();
    </script>
    <title>Meu amigo Broto!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
